# =====================================================
# Server Configuration (Matches Node.js port 5000)
# =====================================================
server.port=5000
spring.application.name=tradexchange-backend

# =====================================================
# Default Database Configuration: H2 (Zero-Setup / Instant Run)
# To use MySQL, set spring.profiles.active=mysql
# =====================================================
spring.datasource.url=jdbc:h2:mem:tradexchange;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# H2 Console (available at http://localhost:5000/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# =====================================================
# Jackson JSON Configuration
# =====================================================
spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.write-dates-as-timestamps=false

# =====================================================
# OpenAPI / Swagger UI (http://localhost:5000/swagger-ui.html)
# =====================================================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method

# =====================================================
# Logging
# =====================================================
logging.level.com.tradexchange=INFO
logging.level.org.springframework.web=INFO
